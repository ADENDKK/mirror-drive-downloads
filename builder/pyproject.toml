[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-drive"
version = "0.1.2"
description = "Plainloop Mirror Drive bootable disk cloning utility"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Plainloop" }]

[project.scripts]
mirror-drive = "mirror_drive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
